# Container-side nginx: serves the built bundle. TLS and routing are the host's
# job; this only has to hand back files and get the SPA fallback right.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Without this, a refresh on /orders/<uuid> asks nginx for a file that does
    # not exist and returns 404 — the route only exists inside the React router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so these are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached: it is what points at the current hashed
    # bundle, so a cached copy pins a browser to a deployment you replaced.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
