[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Exact pin, not a caret range, so the bytecode is reproducible across machines —
# the deployed address goes into .env and the API is built against that ABI.
solc = "0.8.24"

# Do NOT remove. solc 0.8.24 defaults to Cancun, which permits MCOPY / TSTORE.
# Shanghai bytecode runs on any Cancun-or-later chain; the reverse is not true, and a
# missing opcode deploys fine then reverts at runtime looking like a logic bug.
# This contract uses no transient storage, so the conservative target costs nothing.
evm_version = "shanghai"

optimizer = true
optimizer_runs = 200

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"
